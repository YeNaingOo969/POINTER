<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Deals — POINTER</title>
    <meta name="description" content="Discounts posted by shops in Yangon. Take a ticket and show it at the counter." />
    <meta name="theme-color" content="#1a1410" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,100&family=Onest:wght@400;500;700&family=Noto+Sans+Myanmar:wght@400;600&display=swap"
    />
  </head>
  <body class="page-app page-deals">
    <header class="app-top">
      <a class="brand app-top__pill app-top__brand" href="/" aria-label="POINTER home">
        <img class="brand__mark" src="/images/brand/pointer-mark.svg" width="64" height="64" alt="" />
        <img class="brand__word" src="/images/brand/pointer-word.svg" width="117" height="20" alt="" />
      </a>
      <button class="lang-toggle app-top__pill app-top__lang" type="button" data-lang-toggle data-i18n="lang.switch" data-i18n-attr="aria-label:lang.label" aria-label="Switch to Burmese">မြန်မာ</button>
    </header>

    <header class="app-hero">
      <div class="app-hero__inner">
        <p class="app-hero__eyebrow" data-i18n="deals.eyebrow">Deals &amp; tickets</p>
        <h1 class="app-hero__title" data-i18n="deals.title">Deals around Yangon</h1>
        <p class="app-hero__lede" data-i18n="deals.lede">Every deal is posted by the shop itself.</p>
        <div class="app-chips deals-sort" role="group"></div>
        <div class="app-chips deals-groups" role="group"></div>
      </div>
    </header>

    <main class="app-main">
      <section class="app-section">
        <ul class="deal-grid"></ul>
        <p class="deals-empty app-muted" data-i18n="deals.empty" hidden>No deals in this group right now.</p>
        <p class="app-demo" data-i18n="deals.demo" hidden>Demo deals from made-up shops.</p>
      </section>
    </main>

    <script type="module" src="/src/pages/deals.js"></script>
  </body>
</html>
