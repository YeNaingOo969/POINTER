<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Log in — POINTER</title>
    <meta name="description" content="Log in or create a POINTER account to save places, collect check-in stamps and write reviews." />
    <meta name="theme-color" content="#1a1410" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,100&family=Onest:wght@400;500;700&family=Noto+Sans+Myanmar:wght@400;600&display=swap"
    />
    <link
      rel="preload" as="image" href="/images/landing/hero-river-1920.webp"
      imagesrcset="/images/landing/hero-river-1280.webp 1280w, /images/landing/hero-river-1920.webp 1920w, /images/landing/hero-river-3840.webp 3840w"
      imagesizes="100vw"
    />
  </head>
  <body class="page-auth">
    <!-- Full-bleed golden-hour scene behind everything -->
    <div class="auth-bg" aria-hidden="true">
      <img
        class="auth-bg__art"
        src="/images/landing/hero-river-1920.webp"
        srcset="/images/landing/hero-river-1280.webp 1280w, /images/landing/hero-river-1920.webp 1920w, /images/landing/hero-river-3840.webp 3840w"
        sizes="100vw" width="3840" height="2160" alt=""
      />
      <span class="auth-bg__sun"></span>
      <canvas class="auth-bg__embers"></canvas>
      <div class="auth-bg__shade"></div>
    </div>

    <header class="app-top">
      <a class="brand app-top__pill app-top__brand" href="/" aria-label="POINTER home">
        <img class="brand__mark" src="/images/brand/pointer-mark.svg" width="64" height="64" alt="" />
        <img class="brand__word" src="/images/brand/pointer-word.svg" width="117" height="20" alt="" />
      </a>
      <a class="app-top__pill" href="/explore.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        <span data-i18n="place.backToMap">Map</span>
      </a>
      <button class="app-top__pill app-top__lang" type="button" data-i18n="lang.switch" data-i18n-attr="aria-label:lang.label">မြန်မာ</button>
    </header>

    <main class="auth">
      <section class="auth__intro">
        <p class="auth__eyebrow">Explore · Discover · Enjoy</p>
        <h1 class="auth__title" data-i18n="auth.titleLogin">Welcome back.</h1>
        <p class="auth__lede" data-i18n="auth.ledeLogin">Your saved places, check-in stamps and reviews are waiting.</p>
      </section>

      <section class="auth__card" aria-label="Account">
        <!-- Shown when already logged in -->
        <div class="auth__signed" hidden>
          <p class="auth__signed-kicker" data-i18n="auth.loggedInAs">You're logged in as</p>
          <p class="auth__signed-name"></p>
          <a class="auth-button auth-button--gold auth__continue">
            <span data-i18n="auth.continue">Continue</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
          </a>
          <a class="auth-button" href="/passport.html" data-i18n="auth.passport">My Passport</a>
          <button class="auth-button auth-button--quiet auth__logout" type="button" data-i18n="auth.logout">Log out</button>
        </div>

        <div class="auth__forms">
          <div class="auth__tabs" role="tablist" data-active="login">
            <button class="auth__tab" type="button" role="tab" id="tab-login" aria-controls="login-form" aria-selected="true" data-i18n="auth.tabLogin">Log in</button>
            <button class="auth__tab" type="button" role="tab" id="tab-register" aria-controls="register-form" aria-selected="false" tabindex="-1" data-i18n="auth.tabRegister">Create account</button>
          </div>

          <form class="auth-form" id="login-form" role="tabpanel" aria-labelledby="tab-login" novalidate>
            <div class="field">
              <div class="field__control">
                <input id="login-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder=" " required />
                <label for="login-email" data-i18n="auth.email">Email</label>
              </div>
              <p class="field__error" id="login-email-error"></p>
            </div>
            <div class="field">
              <div class="field__control">
                <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder=" " required />
                <label for="login-password" data-i18n="auth.password">Password</label>
                <button class="field__toggle" type="button" data-i18n="auth.show">Show</button>
              </div>
              <p class="field__error" id="login-password-error"></p>
            </div>
            <p class="auth-form__error" role="alert"></p>
            <button class="auth-button auth-button--gold auth-form__submit" type="submit" data-i18n="auth.submitLogin">Log in</button>
          </form>

          <form class="auth-form" id="register-form" role="tabpanel" aria-labelledby="tab-register" novalidate hidden>
            <div class="field">
              <div class="field__control">
                <input id="register-name" name="name" type="text" autocomplete="name" maxlength="100" placeholder=" " required />
                <label for="register-name" data-i18n="auth.name">Your name</label>
              </div>
              <p class="field__error" id="register-name-error"></p>
            </div>
            <div class="field">
              <div class="field__control">
                <input id="register-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder=" " required />
                <label for="register-email" data-i18n="auth.email">Email</label>
              </div>
              <p class="field__error" id="register-email-error"></p>
            </div>
            <div class="field">
              <div class="field__control">
                <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder=" " aria-describedby="register-password-hint" required />
                <label for="register-password" data-i18n="auth.password">Password</label>
                <button class="field__toggle" type="button" data-i18n="auth.show">Show</button>
              </div>
              <p class="field__hint" id="register-password-hint" data-i18n="auth.passwordHint">At least 8 characters</p>
              <p class="field__error" id="register-password-error"></p>
            </div>
            <div class="field">
              <div class="field__control">
                <input id="register-confirm" name="confirm" type="password" autocomplete="new-password" placeholder=" " required />
                <label for="register-confirm" data-i18n="auth.confirm">Confirm password</label>
              </div>
              <p class="field__error" id="register-confirm-error"></p>
            </div>
            <p class="auth-form__error" role="alert"></p>
            <button class="auth-button auth-button--gold auth-form__submit" type="submit" data-i18n="auth.submitRegister">Create account</button>
          </form>

          <p class="auth__demo" data-i18n="auth.demoHint" hidden>Demo account: demo@pointer.test / pointer-demo</p>
        </div>
      </section>
    </main>

    <script type="module" src="/src/pages/login.js"></script>
  </body>
</html>
